<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dílna na skilly</title>
<meta name="description" content="Vyrob si svůj první AI skill. Zabere to 5 minut a nepotřebuješ nic umět.">
<meta property="og:title" content="Dílna na skilly">
<meta property="og:description" content="Vyrob si svůj první AI skill. Zabere to 5 minut a nepotřebuješ nic umět.">
<meta property="og:type" content="website">
<!-- Až budeš znát adresu dílny, přepiš ADRESA-DILNY: -->
<meta property="og:image" content="https://dilna-skillu.aimentor-17e.workers.dev/obrazky/nahled-facebook-dilna.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://dilna-skillu.aimentor-17e.workers.dev/">
<link rel="preload" as="image" href="obrazky/skrinka-zavrena.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3d2a1c;
    --drevo:#8a5a33;
    --drevo-tm:#5e3b20;
    --med:#d9a24a;
    --krem:#fbf4e6;
    --zelena:#5c7f3e;
    --cervena:#a4492a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    min-height:100vh;font-family:"Nunito Sans",system-ui,sans-serif;color:var(--ink);font-size:18px;
    background:#e9dcc6 url("obrazky/dilna-pozadi.webp") center / cover no-repeat fixed;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(251,244,230,.35),rgba(251,244,230,.1) 40%,rgba(251,244,230,.35))}
  .obal{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:18px 16px 70px;min-height:100vh;display:flex;flex-direction:column}

  /* postup */
  .postup{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
  .tecka-k{width:12px;height:12px;border-radius:50%;background:rgba(94,59,32,.25);transition:background .3s, transform .3s}
  .tecka-k.hotovo{background:var(--med)}
  .tecka-k.ted{background:var(--cervena);transform:scale(1.35)}
  .zpet{position:absolute;left:16px;top:14px;border:0;background:rgba(251,244,230,.85);color:var(--ink);font:inherit;font-weight:700;font-size:.95rem;padding:7px 14px;border-radius:999px;cursor:pointer}
  .zpet:hover{background:#fff}

  /* kroky */
  .krok{display:none;flex:1;flex-direction:column;align-items:center;text-align:center}
  .krok.vidno{display:flex;animation:vstup .55s cubic-bezier(.2,.9,.3,1)}
  @keyframes vstup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;margin:0;line-height:1.08;
    text-shadow:0 0 18px rgba(251,244,230,.95),0 0 5px rgba(251,244,230,.9)}
  h1{font-size:clamp(2.6rem,8vw,4.4rem)}
  h2{font-size:clamp(2rem,6vw,3rem);margin-bottom:10px}
  .pod{max-width:560px;margin:10px auto 0;font-weight:700;font-size:1.15rem;text-shadow:0 0 12px rgba(251,244,230,1),0 0 4px rgba(251,244,230,1)}

  .tlacitko{
    margin-top:22px;border:0;border-radius:999px;padding:15px 30px;background:var(--cervena);color:#fff;
    font:inherit;font-weight:800;font-size:1.12rem;cursor:pointer;box-shadow:0 5px 14px rgba(120,50,20,.3);
    transition:transform .15s, background .2s;
  }
  .tlacitko:hover{background:#8c3b22;transform:translateY(-2px)}
  .tlacitko.druhe{background:var(--krem);color:var(--ink);box-shadow:0 3px 10px rgba(60,40,20,.2)}
  .tlacitko.druhe:hover{background:#fff}

  /* papír (obrázek, nebo náhradní CSS papír) */
  .papir{
    position:relative;background:#fbf3e2;background-clip:padding-box;
    border:22px solid transparent;border-image:url("obrazky/papir-cisty.webp") 60 fill / 22px / 0 stretch;
    padding:12px 16px 8px;filter:drop-shadow(0 8px 14px rgba(60,40,20,.22));text-align:left;
    font-size:1.12rem;line-height:1.6;
  }
  .papir.zmackany{border-image-source:url("obrazky/papir-zmackany.webp");transform:rotate(-1.5deg)}
  .papir p{margin:0 0 10px}

  /* úvod: skříňka */
  .skrinka{position:relative;width:min(340px,70vw);margin:18px auto 0}
  .skrinka img{width:100%;display:block;filter:drop-shadow(0 12px 14px rgba(60,40,20,.35))}
  .skrinka .stitek-skill{
    position:absolute;left:49.5%;top:59.3%;transform:translate(-50%,-50%);
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:clamp(1.1rem,3.6vw,1.6rem);color:var(--drevo-tm);
    pointer-events:none;
  }
  /* náhradní skříňka, než dorazí obrázek */
  .skrinka.otevrena .stitek-skill{top:67.9%;left:50.5%}
  .skrinka.bez-obrazku img{display:none}
  .skrinka.bez-obrazku{
    aspect-ratio:1/1.05;border-radius:12px;padding:8%;
    background:linear-gradient(160deg,#b07a47,#7d4f2b);box-shadow:0 14px 26px rgba(60,40,20,.35), inset 0 0 0 6px rgba(60,35,15,.35);
    display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1.5fr 1fr;gap:6%;
  }
  .skrinka.bez-obrazku .sup{border-radius:6px;background:linear-gradient(180deg,#c89660,#9a6638);box-shadow:inset 0 0 0 3px rgba(60,35,15,.3);position:relative}
  .skrinka.bez-obrazku .sup::after{content:"";position:absolute;left:50%;top:50%;width:18%;height:10%;min-height:6px;border-radius:4px;background:#e8c27a;transform:translate(-50%,-50%)}
  .skrinka.bez-obrazku .sup.velky{grid-column:1 / 4;background:linear-gradient(180deg,#d6a56c,#a06c3c)}
  .skrinka.bez-obrazku .sup.velky::after{display:none}
  .skrinka.bez-obrazku .stitek-skill{top:50%}
  .skrinka:not(.bez-obrazku) .sup{display:none}
  .skrinka.otevrena.bez-obrazku .sup.velky{transform:translateY(14%) scale(1.08);box-shadow:0 12px 18px rgba(40,20,10,.45), inset 0 0 0 3px rgba(60,35,15,.3)}
  .skrinka.zatrast{animation:zatrast .45s}
  @keyframes zatrast{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(10px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .skrinka.cvak{animation:cvak .5s}
  @keyframes cvak{0%{transform:scale(1)}40%{transform:scale(1.06,.95)}70%{transform:scale(.98,1.02)}100%{transform:scale(1)}}

  /* příběh */
  .sceny{display:grid;gap:16px;max-width:640px;width:100%;margin-top:8px}
  .scena{opacity:0;transform:translateY(16px) rotate(var(--rot,0deg));transition:opacity .5s, transform .5s}
  .scena.ukaz{opacity:1;transform:rotate(var(--rot,0deg))}
  .scena .cislo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:1.5rem;color:var(--cervena);display:block;margin-bottom:2px}
  .pointa{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700;margin-top:18px;
    text-shadow:0 0 14px rgba(251,244,230,1);opacity:0;transform:scale(.8);transition:opacity .5s, transform .5s cubic-bezier(.2,1.4,.4,1)}
  .pointa.ukaz{opacity:1;transform:none}
  .pointa strong{color:var(--cervena)}

  /* co je skill */
  .dvojice{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:760px;width:100%;margin-top:10px;align-items:stretch}
  .dvojice .papir{display:flex;flex-direction:column;justify-content:center}
  .dvojice .ikona{font-size:2.6rem;line-height:1;margin-bottom:10px;text-align:center}
  .poznamka{margin-top:18px;font-weight:700;background:rgba(251,244,230,.88);padding:10px 18px;border-radius:999px}
  @media (max-width:640px){.dvojice{grid-template-columns:1fr}}

  /* hra */
  .hra{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center;width:100%;margin-top:6px}
  .hra{align-items:start}
  .hra-pravo{position:sticky;top:16px}
  @media (max-width:760px){
    .hra{grid-template-columns:1fr}
    .hra .hra-pravo{order:-1;top:6px;z-index:5;display:grid;grid-template-columns:40% 1fr;gap:4px 12px;align-items:center;
      background:rgba(251,244,230,.9);border-radius:16px;padding:8px 10px;box-shadow:0 4px 14px rgba(60,40,20,.18)}
    .hra .hra-pravo .skrinka{grid-row:1 / 3;width:100%;margin:0}
    .hra .hra-pravo .pocitadlo{margin:0;padding:0;background:none;text-align:left}
    .hra .hra-pravo .hlaska{margin:0;min-height:0;font-size:.92rem;padding:6px 8px;text-align:left;max-width:none}
  }
  .dilky{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dilek{
    position:relative;border:0;cursor:pointer;color:var(--ink);font:inherit;background:none;padding:0;
    display:flex;flex-direction:column;align-items:center;transition:transform .15s, opacity .3s;
  }
  .dilek:hover{transform:translateY(-3px) rotate(-1.5deg)}
  .dilek .deska{position:relative;width:100%;aspect-ratio:520/316;background:url("obrazky/dilek.webp") center / contain no-repeat;filter:drop-shadow(0 5px 6px rgba(60,40,20,.3))}
  .dilek b{
    position:absolute;left:23%;right:24%;top:61%;bottom:17%;display:flex;align-items:center;justify-content:center;
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:clamp(.92rem,2.2vw,1.12rem);line-height:1;text-align:center;
  }
  .dilek span{display:block;margin-top:-2px;font-size:.9rem;line-height:1.35;background:rgba(251,244,230,.95);padding:7px 10px;border-radius:10px;box-shadow:0 2px 6px rgba(60,40,20,.15);text-align:left;width:94%}
  .dilek:focus-visible{outline:3px solid var(--cervena);outline-offset:3px;border-radius:12px}
  .dilek.pryc{visibility:hidden}
  .dilek.spatne{animation:zatrast .45s}
  .hra-pravo{display:flex;flex-direction:column;align-items:center}
  .pocitadlo{font-weight:800;margin-top:12px;background:rgba(251,244,230,.9);padding:6px 16px;border-radius:999px}
  .hlaska{min-height:3.2em;margin-top:12px;max-width:380px;font-weight:700;padding:10px 16px;border-radius:14px;background:rgba(251,244,230,.92);opacity:0;transition:opacity .25s}
  .hlaska.ukaz{opacity:1}
  .hlaska.dobre{color:#2f5520}
  .hlaska.spatne{color:#8c2f18}
  .letici{position:fixed;z-index:50;pointer-events:none;margin:0}
  .klicek{
    position:fixed;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%) scale(0);text-align:center;pointer-events:none;
    transition:transform .5s cubic-bezier(.2,1.5,.4,1);
  }
  .klicek.ukaz{transform:translate(-50%,-50%) scale(1)}
  .klicek .obr{width:220px;height:110px;margin:0 auto;background:url("obrazky/klicek.webp") center / contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:80px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:otoc 1.2s ease-in-out}
  @keyframes otoc{0%{transform:rotate(-40deg) scale(.6)}60%{transform:rotate(12deg) scale(1.05)}100%{transform:none}}
  .klicek .text{margin-top:6px;background:var(--zelena);color:#fff;font-weight:800;font-size:1.3rem;padding:10px 22px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .hobliny{position:fixed;width:22px;height:10px;border-radius:50% 50% 50% 50%/80% 80% 20% 20%;border:3px solid #d9a860;border-bottom:0;z-index:55;pointer-events:none}
  .janin-skill{max-width:600px;width:100%;margin-top:18px}
  .janin-skill h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;margin:0 0 8px}

  /* před a po */
  .zadani-bublina{display:inline-block;margin:6px 0 16px;background:#fff;padding:12px 20px;border-radius:18px 18px 18px 4px;font-weight:700;box-shadow:0 4px 12px rgba(60,40,20,.15)}
  .predpo .stitek-pp{display:inline-block;align-self:flex-start;font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:999px;margin-bottom:10px;color:#fff}
  .predpo .bez{background:#9a7b6a}
  .predpo .se{background:var(--zelena)}
  .predpo .papir.zmackany p{color:#5d4a3c}

  /* výroba */
  .vyroba{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;margin-top:8px;text-align:left}
  @media (max-width:820px){.vyroba{grid-template-columns:1fr}}
  .napady{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 14px}
  .napad{border:2px solid rgba(94,59,32,.3);background:rgba(251,244,230,.92);color:var(--ink);font:inherit;font-weight:700;font-size:.98rem;padding:9px 16px;border-radius:999px;cursor:pointer}
  .napad.aktivni{background:var(--drevo);border-color:var(--drevo);color:#fff}
  .pole{margin-bottom:12px;background:rgba(251,244,230,.95);border-radius:14px;padding:12px 14px;box-shadow:0 3px 10px rgba(60,40,20,.12)}
  .pole label{display:block;font-weight:800;margin-bottom:2px}
  .pole small{display:block;opacity:.75;margin-bottom:6px;font-size:.88rem}
  .pole textarea,.pole input{width:100%;font:inherit;font-size:1rem;color:var(--ink);border:1.5px solid #dcc9a8;border-radius:10px;padding:9px 11px;background:#fff;resize:vertical}
  .pole textarea:focus,.pole input:focus{outline:2px solid var(--med);border-color:var(--med)}
  .nahled-skill{position:sticky;top:12px;align-self:start}
  .nahled-skill pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:.86rem;line-height:1.5;margin:0;max-height:52vh;overflow:auto}
  .co-dal{margin-top:14px;font-size:1rem;line-height:1.55;background:rgba(251,244,230,.95);padding:12px 16px;border-radius:14px}

  /* závěr */
  .odkazy{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .odkazy a{background:rgba(251,244,230,.95);color:var(--ink);font-weight:800;text-decoration:none;padding:11px 18px;border-radius:999px;box-shadow:0 3px 10px rgba(60,40,20,.15)}
  .odkazy a:hover{background:#fff}

  footer{position:relative;z-index:1;text-align:center;font-size:.85rem;font-weight:700;padding:0 16px 16px}
  footer span{background:rgba(251,244,230,.85);padding:5px 12px;border-radius:999px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--ink);color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;transition:opacity .25s, transform .25s;pointer-events:none}
  .toast.ukaz{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    .krok.vidno{animation:none}
    .scena,.pointa{transition:none}
  }
</style>
</head>
<body>
<div class="obal">
  <button class="zpet" id="zpet" hidden>← Zpět</button>
  <div class="postup" id="postup" aria-hidden="true"></div>

  <!-- 0 ÚVOD -->
  <section class="krok" data-krok="0">
    <h1 id="nadpis"></h1>
    <p class="pod" id="podnadpis"></p>
    <div class="skrinka" id="skrinka-uvod"></div>
    <button class="tlacitko" data-dal>Vstoupit do dílny →</button>
  </section>

  <!-- 1 PŘÍBĚH -->
  <section class="krok" data-krok="1">
    <h2>Proč?</h2>
    <div class="sceny" id="sceny"></div>
    <div class="pointa" id="pointa"></div>
    <button class="tlacitko" id="dalsi-scena">Co bylo dál? →</button>
    <button class="tlacitko" data-dal id="po-pribehu" hidden>A co je to ten skill? →</button>
  </section>

  <!-- 2 CO JE SKILL -->
  <section class="krok" data-krok="2">
    <h2>Co je skill?</h2>
    <div class="dvojice">
      <div class="papir zmackany"><div class="ikona"><img src="obrazky/tuzka.webp" alt="" style="height:44px"></div><p id="t-prompt"></p></div>
      <div class="papir"><div class="ikona"><img src="obrazky/skrinka-zavrena.webp" alt="" style="height:70px"></div><p id="t-skill"></p></div>
    </div>
    <div class="poznamka" id="t-kde"></div>
    <button class="tlacitko" data-dal>Jdu naplnit šuplík →</button>
  </section>

  <!-- 3 HRA -->
  <section class="krok" data-krok="3">
    <h2>Naplň šuplík</h2>
    <p class="pod" id="hra-zadani"></p>
    <div class="hra">
      <div class="dilky" id="dilky"></div>
      <div class="hra-pravo">
        <div class="skrinka otevrena" id="skrinka-hra"></div>
        <div class="pocitadlo" id="pocitadlo"></div>
        <div class="hlaska" id="hlaska" aria-live="polite"></div>
      </div>
    </div>
    <div class="janin-skill papir" id="janin-skill" hidden></div>
    <button class="tlacitko" data-dal id="po-hre" hidden>Ukaž mi rozdíl →</button>
  </section>

  <!-- 4 PŘED A PO -->
  <section class="krok predpo" data-krok="4">
    <h2>Před a po</h2>
    <div>Jana napíše AI:</div>
    <div class="zadani-bublina" id="t-zadani"></div>
    <div class="dvojice">
      <div class="papir zmackany"><span class="stitek-pp bez">Bez skillu</span><p id="t-pred"></p></div>
      <div class="papir"><span class="stitek-pp se">Se skillem</span><p id="t-po"></p></div>
    </div>
    <button class="tlacitko" data-dal>Chci si vyrobit vlastní →</button>
  </section>

  <!-- 5 VÝROBA -->
  <section class="krok" data-krok="5">
    <h2><img src="obrazky/tuzka.webp" alt="" style="height:.8em;vertical-align:middle;margin-right:10px;transform:rotate(-12deg)">Vyrob si svůj vlastní</h2>
    <p class="pod">Vyber si nápad, nebo napiš vlastní. Zároveň se ti skládá hotový skill.</p>
    <div class="napady" id="napady"></div>
    <div class="vyroba">
      <div id="pole"></div>
      <div class="nahled-skill">
        <div class="papir"><pre id="skill-text"></pre></div>
        <button class="tlacitko" id="kopirovat">📋 Zkopírovat skill</button>
        <div class="co-dal" id="co-dal"></div>
      </div>
    </div>
    <button class="tlacitko druhe" data-dal>Hotovo →</button>
  </section>

  <!-- 6 ZÁVĚR -->
  <section class="krok" data-krok="6">
    <div class="skrinka" id="skrinka-zaver"></div>
    <h2 id="zaver-nadpis" style="margin-top:16px"></h2>
    <p class="pod" id="zaver-text"></p>
    <div class="odkazy" id="odkazy"></div>
    <button class="tlacitko druhe" id="znovu">Projít dílnu znovu</button>
  </section>
</div>

<footer><span id="paticka"></span></footer>
<div class="klicek" id="klicek"><div class="obr" id="klicek-obr"></div><div class="text" id="klicek-text"></div></div>
<div class="toast" id="toast"></div>

<script src="obsah.js"></script>
<script>
(function(){
  const D = DILNA;
  const malyPohyb = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  // ---------- texty ----------
  $("nadpis").textContent = D.nadpis;
  $("podnadpis").textContent = D.podnadpis;
  $("t-prompt").innerHTML = fmt(D.prompt);
  $("t-skill").innerHTML = fmt(D.skill);
  $("t-kde").textContent = D.kdeFunguje;
  $("hra-zadani").textContent = D.hraZadani;
  $("t-zadani").textContent = D.zadani;
  $("t-pred").textContent = D.pred;
  $("t-po").textContent = D.po;
  $("co-dal").innerHTML = fmt(D.coDal);
  $("zaver-nadpis").textContent = D.zaverNadpis;
  $("zaver-text").textContent = D.zaverText;
  $("paticka").textContent = "Vytvořila " + D.autorka;
  $("odkazy").innerHTML =
    '<a href="' + esc(D.skupinaOdkaz) + '" target="_blank" rel="noopener">Skupina ' + esc(D.skupina) + ' →</a>' +
    '<a href="' + esc(D.kalendarOdkaz) + '" target="_blank" rel="noopener">Adventní kalendář →</a>';

  // ---------- skříňka (obrázek, nebo náhradní kresba) ----------
  function skrinka(el, otevrena){
    el.innerHTML =
      '<img alt="" src="obrazky/' + (otevrena ? "skrinka-otevrena" : "skrinka-zavrena") + '.webp">' +
      '<div class="sup"></div><div class="sup"></div><div class="sup"></div>' +
      '<div class="sup velky"></div>' +
      '<div class="sup"></div><div class="sup"></div><div class="sup"></div>' +
      '<div class="stitek-skill">Skill</div>';
    el.classList.toggle("otevrena", !!otevrena);
    const img = el.querySelector("img");
    img.onerror = () => el.classList.add("bez-obrazku");
    img.onload = () => el.classList.remove("bez-obrazku");
  }
  skrinka($("skrinka-uvod"), false);
  skrinka($("skrinka-hra"), true);
  skrinka($("skrinka-zaver"), false);

  // ---------- klíček (obrázek, nebo 🔑) ----------
  const kl = new Image();
  kl.onerror = () => { $("klicek-obr").textContent = "🔑"; };
  kl.src = "obrazky/klicek.webp";

  // ---------- kroky ----------
  const kroky = [...document.querySelectorAll(".krok")];
  let aktualni = 0;
  $("postup").innerHTML = kroky.map(() => '<span class="tecka-k"></span>').join("");
  function jdiNa(n){
    aktualni = Math.max(0, Math.min(kroky.length - 1, n));
    kroky.forEach((k, i) => k.classList.toggle("vidno", i === aktualni));
    [...$("postup").children].forEach((t, i) => { t.className = "tecka-k" + (i < aktualni ? " hotovo" : i === aktualni ? " ted" : ""); });
    $("zpet").hidden = aktualni === 0;
    scrollTo({top:0, behavior: malyPohyb ? "auto" : "smooth"});
    if (aktualni === 1) startPribeh();
    if (aktualni === 3) startHra();
  }
  document.querySelectorAll("[data-dal]").forEach(b => b.addEventListener("click", () => jdiNa(aktualni + 1)));
  $("zpet").addEventListener("click", () => jdiNa(aktualni - 1));
  $("znovu").addEventListener("click", () => jdiNa(0));

  // ---------- 1. příběh ----------
  let scena = 0;
  function startPribeh(){
    scena = 0;
    $("sceny").innerHTML = D.pribeh.map((t, i) =>
      '<div class="papir scena" style="--rot:' + [-1.2, .9, -.6][i % 3] + 'deg"><span class="cislo">' + (i + 1) + '.</span>' + esc(t) + '</div>').join("");
    $("pointa").innerHTML = fmt(D.pribehPointa); $("pointa").classList.remove("ukaz");
    $("dalsi-scena").hidden = false; $("po-pribehu").hidden = true;
    ukazScenu();
  }
  function ukazScenu(){
    const s = $("sceny").children[scena];
    if (s) requestAnimationFrame(() => s.classList.add("ukaz"));
    scena++;
    if (scena >= D.pribeh.length){
      $("dalsi-scena").hidden = true;
      setTimeout(() => { $("pointa").classList.add("ukaz"); $("po-pribehu").hidden = false; }, malyPohyb ? 0 : 600);
    }
  }
  $("dalsi-scena").addEventListener("click", ukazScenu);

  // ---------- 3. hra ----------
  let vlozeno = 0, hraHotova = false;
  const pocetDobrych = D.dilky.filter(d => d.spravne).length;
  function zamichej(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function startHra(){
    if (hraHotova) return;
    vlozeno = 0;
    skrinka($("skrinka-hra"), true);
    $("pocitadlo").textContent = "V šuplíku: 0 z " + pocetDobrych;
    $("hlaska").className = "hlaska";
    $("janin-skill").hidden = true; $("po-hre").hidden = true;
    const box = $("dilky"); box.innerHTML = "";
    zamichej(D.dilky).forEach(d => {
      const b = document.createElement("button");
      b.className = "dilek";
      b.innerHTML = '<div class="deska"><b>' + esc(d.nazev) + "</b></div><span>" + esc(d.text) + "</span>";
      b.addEventListener("click", () => klikDilek(b, d));
      box.appendChild(b);
    });
  }
  function hlaska(text, typ){
    const h = $("hlaska");
    h.textContent = text; h.className = "hlaska ukaz " + typ;
  }
  function klikDilek(b, d){
    if (b.classList.contains("pryc") || hraHotova) return;
    const sk = $("skrinka-hra");
    if (!d.spravne){
      b.classList.remove("spatne"); void b.offsetWidth; b.classList.add("spatne");
      sk.classList.remove("zatrast"); void sk.offsetWidth; sk.classList.add("zatrast");
      hlaska("✗ " + d.hlaska, "spatne");
      return;
    }
    hlaska("✓ " + d.hlaska, "dobre");
    letDoSupliku(b, sk, () => {
      vlozeno++;
      $("pocitadlo").textContent = "V šuplíku: " + vlozeno + " z " + pocetDobrych;
      sk.classList.remove("cvak"); void sk.offsetWidth; sk.classList.add("cvak");
      if (vlozeno >= pocetDobrych) dokonciHru();
    });
  }
  function letDoSupliku(b, sk, hotovo){
    const r = b.getBoundingClientRect(), c = sk.getBoundingClientRect();
    b.classList.add("pryc");
    if (malyPohyb){ hotovo(); return; }
    const kl = b.cloneNode(true);
    kl.classList.remove("pryc"); kl.classList.add("letici");
    Object.assign(kl.style, {left:r.left + "px", top:r.top + "px", width:r.width + "px", height:r.height + "px"});
    document.body.appendChild(kl);
    const dx = (c.left + c.width/2) - (r.left + r.width/2), dy = (c.top + c.height*0.55) - (r.top + r.height/2);
    kl.animate([
      {transform:"translate(0,0) rotate(0) scale(1)", opacity:1},
      {transform:"translate(" + dx*0.5 + "px," + (dy*0.5 - 80) + "px) rotate(-12deg) scale(.8)", opacity:1, offset:.5},
      {transform:"translate(" + dx + "px," + dy + "px) rotate(8deg) scale(.15)", opacity:.2}
    ], {duration:750, easing:"cubic-bezier(.4,0,.6,1)"}).onfinish = () => { kl.remove(); hotovo(); };
  }
  function dokonciHru(){
    hraHotova = true;
    const sk = $("skrinka-hra");
    setTimeout(() => {
      skrinka(sk, false);
      sk.classList.add("cvak");
      $("klicek-text").textContent = D.hraHotovo;
      $("klicek").classList.add("ukaz");
      hobliny(sk);
      setTimeout(() => {
        $("klicek").classList.remove("ukaz");
        const dobre = D.dilky.filter(d => d.spravne);
        $("janin-skill").innerHTML = "<h3>Takhle vypadá Janin skill:</h3>" +
          dobre.map(d => "<p><strong>" + esc(d.nazev) + ":</strong> " + esc(d.text) + "</p>").join("");
        $("janin-skill").hidden = false; $("po-hre").hidden = false;
        $("dilky").innerHTML = "";
        $("hlaska").className = "hlaska";
      }, 2200);
    }, 400);
  }
  function hobliny(el){
    if (malyPohyb) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    for (let i = 0; i < 22; i++){
      const h = document.createElement("div");
      h.className = "hobliny";
      h.style.left = cx + "px"; h.style.top = cy + "px";
      h.style.borderColor = ["#d9a860","#c08a4a","#e8c98e","#a8733d"][i % 4];
      document.body.appendChild(h);
      const u = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170;
      h.animate([
        {transform:"translate(0,0) rotate(0)", opacity:1},
        {transform:"translate(" + Math.cos(u)*d + "px," + (Math.sin(u)*d - 60) + "px) rotate(" + (Math.random()*720) + "deg)", opacity:1, offset:.6},
        {transform:"translate(" + Math.cos(u)*d*1.1 + "px," + (Math.sin(u)*d + 120) + "px) rotate(" + (Math.random()*900) + "deg)", opacity:0}
      ], {duration:1500 + Math.random()*600, easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = () => h.remove();
    }
  }

  // ---------- 5. výroba ----------
  const POLE = [
    {id:"nazev",   label:"1. Název",            tip:"Krátce, jak se tvůj skill jmenuje.", input:true},
    {id:"kdy",     label:"1. Kdy mě použít",    tip:"Nejdůležitější! Podle toho AI pozná, kdy šuplík otevřít."},
    {id:"kdo",     label:"2. Kdo jsi",          tip:"V jaké roli má AI být?"},
    {id:"co",      label:"3. Co udělat",        tip:"Postup krok za krokem."},
    {id:"styl",    label:"4. Jakým stylem",     tip:"Tvoje pravidla: tykat/vykat, délka, tón, co nechceš."},
    {id:"priklad", label:"5. Příklad",          tip:"Jeden ukázkový výsledek, jak to má vypadat."}
  ];
  $("pole").innerHTML = POLE.map(p =>
    '<div class="pole"><label for="f-' + p.id + '">' + p.label + '</label><small>' + p.tip + '</small>' +
    (p.input ? '<input id="f-' + p.id + '">' : '<textarea id="f-' + p.id + '" rows="2"></textarea>') + '</div>').join("");
  $("napady").innerHTML = D.napady.map((n, i) => '<button class="napad" data-i="' + i + '">' + esc(n.tlacitko) + '</button>').join("");
  function vyberNapad(i){
    const n = D.napady[i];
    POLE.forEach(p => { const el = $("f-" + p.id); el.value = n[p.id] || ""; el.placeholder = n[p.id] ? "" : D.napady[0][p.id]; });
    [...$("napady").children].forEach((b, j) => b.classList.toggle("aktivni", j === i));
    sloz();
  }
  $("napady").addEventListener("click", e => { const b = e.target.closest(".napad"); if (b) vyberNapad(+b.dataset.i); });
  POLE.forEach(p => $("f-" + p.id).addEventListener("input", sloz));
  function slug(s){
    return (s || "muj-skill").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "muj-skill";
  }
  function hodnota(id){ return $("f-" + id).value.trim(); }
  function sloz(){
    const nazev = hodnota("nazev") || "Můj skill";
    const t =
      "---\n" +
      "name: " + slug(hodnota("nazev")) + "\n" +
      "description: " + (hodnota("kdy") || "…kdy mě má AI použít…") + "\n" +
      "---\n\n" +
      "# " + nazev + "\n\n" +
      "## Kdo jsi\n" + (hodnota("kdo") || "…") + "\n\n" +
      "## Co udělat\n" + (hodnota("co") || "…") + "\n\n" +
      "## Jakým stylem\n" + (hodnota("styl") || "…") + "\n\n" +
      "## Příklad\n" + (hodnota("priklad") || "…") + "\n";
    $("skill-text").textContent = t;
    $("kopirovat").textContent = "📋 Zkopírovat skill";
  }
  $("kopirovat").addEventListener("click", async () => {
    const text = $("skill-text").textContent;
    try { await navigator.clipboard.writeText(text); }
    catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(_){} ta.remove(); }
    $("kopirovat").textContent = "✓ Zkopírováno";
    toast("Skill je zkopírovaný. Vlož ho do AI.");
  });
  let casToast;
  function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("ukaz"); clearTimeout(casToast); casToast = setTimeout(() => el.classList.remove("ukaz"), 2600); }
  vyberNapad(0);

  jdiNa(0);
})();
</script>
</body>
</html>
